<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petro-ImageGen</title>
    <!-- New code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- New Code Ending....  -->
    <link rel="stylesheet" href="File1.css">
</head>
<body>
    
    <div class="container">
        
        <div class="header">
            <h1>
                <span id="typewriter-text">Petro-Ai-Image</span><span class="typewriter-cursor">|</span>
            </h1>
            <div class="hero-subtitle">
                The 
                <span class="word-carousel">
                    <span class="carousel-inner">
                        <b class="carousel-word">BEST</b>
                        <b class="carousel-word">GOAT</b>
                        <b class="carousel-word">SIGMA</b>
                        <b class="carousel-word">MANLY</b>
                        <b class="carousel-word">BEST</b>
                    </span>
                </span>
                AI Image Generator
            </div>
        </div>

        <div class="generator-section">
            <div class="image-section">
                <label for="prompt-input">Describe your idea:</label>
                <textarea class="prompt-input" id="prompt-input" placeholder="A mouse riding a flying lion on his back / A happy banana"></textarea>
            </div>
        </div>

        <div class="controls">

            <!-- Mode for the image -->
            <div class="controls-group">
                <label for="Mode">Mode</label>
                <select id="Mode" class="control-input">
                    <option value="Fast">Fast</option>
                    <option value="Medium">Medium</option>
                    <option value="Think">Think</option>
                    <option value="Extra">Extra</option>
                </select>
            </div>

            <!-- Art Style of the image -->
            <div class="controls-group">
                <label for="style">Art Style</label>
                <select id="style" class="control-input">
                    <option value="realistic">realistic</option>
                    <option value="fiction">fiction</option>
                    <option value="cartoon">cartoon</option>
                    <option value="artistic">artistic</option>
                    <option value="ghibli">ghibli</option>
                    <option value="Anime">Anime</option>
                </select>
            </div>

            <!-- Quality of the image -->
            <div class="controls-group">
                <label for="quality">Quality</label>
                <select id="quality" class="control-input">
                    <option value="720p60">720p60</option>
                    <option value="360p">360p</option>
                    <option value="144p">144p</option>
                    <option value="Auto">Auto</option>
                </select>
            </div>

            <!-- Resolution of the image -->
            <div class="controls-group">
                <label for="resolution">Resolution</label>
                <select id="resolution" class="control-input">
                    <option value="512x512">Square (512x512)</option>
                    <option value="1024x1024">HD Square (1024x1024)</option>
                    <option value="1280x720">Landscape (1280x720)</option>
                    <option value="720x1280">Portrait (720x1280)</option>
                </select>
            </div>
            
            <!-- generate Button -->
            <button class="generate-btn" id="generateBtn">
                <span class="loading-spinner"></span>
                <span class="btn-text">Generate</span>
            </button>
        </div>
        
        <div class="results-section">
            <div class="results-header">
                <h2>Generated Images..</h2>
            </div>

            <div id="results">
                <div class="placeholder">
                    <p>Your generated images will appear here:</p>
                    <p>Enter a prompt and click generate image to get started :D</p>
                </div>
            </div>
        </div>

    </div>

    <script src="File1.js"></script>
</body>
</html>
